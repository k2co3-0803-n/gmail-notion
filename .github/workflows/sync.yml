name: Sync card total to Notion

on:
  schedule:
    # UTC 02:15 = Amsterdam 03:15 (冬) / 04:15 (夏)。
    # 日付をまたいだ後にAmsterdamの前日分を確定させる。
    - cron: "15 2 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "集計日 (YYYY-MM-DD、省略時はAmsterdamの当日)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Aggregate and sync
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATE_PROPERTY: ${{ vars.NOTION_DATE_PROPERTY || '日付' }}
          NOTION_AMOUNT_PROPERTY: ${{ vars.NOTION_AMOUNT_PROPERTY || 'Money I spent' }}
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            python card_to_notion.py --date "$TARGET_DATE"
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            TARGET_DATE=$(TZ=Europe/Amsterdam date --date='yesterday' +%F)
            echo "Amsterdamの前日 $TARGET_DATE を同期します"
            python card_to_notion.py --date "$TARGET_DATE"
          else
            # 手動実行で日付が空ならAmsterdamの当日を同期する。
            python card_to_notion.py
          fi
